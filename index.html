    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Max-Regular', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              amplia: {
                bg: '#131314',        // Deep AI Studio background
                surface: '#1E1F20',   // Lighter surface
                border: '#444746',    // Subtle borders
                accent: '#A8C7FA',    // Google-like pastel blue

                text: '#E3E3E3',
                textDim: '#C4C7C5',

                warning: '#FDD663',
                error: '#F28B82'
              }
            }
          }
        }
      }

    <style>
      @font-face {
        font-family: 'Max-Regular';
        src: local('Max-Regular'), local('Max Regular');
        font-weight: 400;
        font-style: normal;
      }
      
      body {
        background-color: #131314;
        color: #E3E3E3;
        font-family: 'Max-Regular', sans-serif;
        font-weight: 400;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #131314; 
      }
      ::-webkit-scrollbar-thumb {
        background: #444746; 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5E5E5E; 
      }
      
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
