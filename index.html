<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Zarpa by amplia | Ficheiros de deploy gerados com IA</title>
    <meta name="description" content="A Zarpa lê o seu repositório e gera o Dockerfile, a pipeline de CI/CD e a infraestrutura na cloud, com custo estimado. Reveja e publique." />
    <meta name="author" content="Amplia Solutions" />
    <meta name="theme-color" content="#0C0D0F" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zarpa by amplia" />
    <meta property="og:description" content="Do repositório à produção: Dockerfile, CI/CD e infraestrutura gerados com IA." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/Max-Regular.woff" as="font" type="font/woff" crossorigin />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Max', 'Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              amplia: {
                bg: 'var(--color-bg)',
                surface: 'var(--color-surface)',
                border: 'var(--color-border)',
                accent: 'var(--color-accent)',
                accentHover: 'var(--color-accent-hover)',
                onAccent: 'var(--color-on-accent)',
                text: 'var(--color-text)',
                textDim: 'var(--color-text-dim)',
                success: 'var(--color-success)',
                warning: 'var(--color-warning)',
                error: 'var(--color-error)'
              }
            },
            boxShadow: { hard: '4px 4px 0 0 var(--color-text)' },
            borderRadius: { none: '0', sm: '2px', DEFAULT: '4px', md: '4px', lg: '6px', xl: '6px', '2xl': '6px', '3xl': '6px' }
          }
        }
      }
    </script>
    <style>
      /* Zarpa by amplia: só modo escuro (terminal). Preto, Osso e Laranja Contentor. */
      :root, [data-theme="dark"] {
        --color-bg: #15171A;
        --color-surface: #1E2125;
        --color-border: #3A3E44;
        --color-accent: #FF6A1A;
        --color-accent-hover: #FF7E33;
        --color-on-accent: #0C0D0F;
        --color-text: #EDE9E1;
        --color-text-dim: #A19D95;
        --color-success: #75E0A7;
        --color-warning: #FFC29E;
        --color-error: #F97066;
        color-scheme: dark;
      }

      @font-face {
        font-family: 'Max';
        src: url('/fonts/Max-Regular.woff') format('woff');
        font-weight: 100 900;
        font-display: swap;
      }

      * {
        font-family: 'Max', 'Inter', sans-serif !important;
        font-weight: 400 !important;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      code, pre, .font-mono, [class*="font-mono"] {
        font-family: 'JetBrains Mono', monospace !important;
        letter-spacing: 0em;
      }
      
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        overflow-x: hidden;
      }

      /* antes «glass» (desfoque); agora superfície sólida */
      .glass {
        background: var(--color-surface);
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

      .page-transition {
        animation: pageIn 0.2s ease-out;
      }

      @keyframes pageIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-accent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
