<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpsFlow | Amplia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: ['class', '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Max-Regular', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              amplia: {
                bg: 'var(--color-bg)',
                surface: 'var(--color-surface)',
                border: 'var(--color-border)',
                accent: 'var(--color-accent)',
                accentHover: 'var(--color-accent-hover)',
                text: 'var(--color-text)',
                textDim: 'var(--color-text-dim)',
                success: 'var(--color-success)',
                warning: 'var(--color-warning)',
                error: 'var(--color-error)'
              }
            }
          }
        }
      }
    </script>
    <style>
      @font-face {
        font-family: 'Max-Regular';
        src: local('Max-Regular'), local('Max Regular');
        font-weight: 400;
        font-style: normal;
      }
      
      :root {
        /* Light Mode Defaults */
        --color-bg: #F0F2F5;
        --color-surface: #FFFFFF;
        --color-border: #D1D5DB;
        --color-accent: #2563EB; /* Blue-600 for better visibility on light */
        --color-accent-hover: #1D4ED8;
        --color-text: #111827;
        --color-text-dim: #4B5563;
        --color-success: #16A34A;
        --color-warning: #D97706;
        --color-error: #DC2626;
      }

      [data-theme="dark"] {
        /* Dark Mode Defaults (Original) */
        --color-bg: #131314;
        --color-surface: #1E1F20;
        --color-border: #444746;
        --color-accent: #A8C7FA;
        --color-accent-hover: #8AB4F8;
        --color-text: #E3E3E3;
        --color-text-dim: #C4C7C5;
        --color-success: #81C995;
        --color-warning: #FDD663;
        --color-error: #F28B82;
      }
      
      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Max-Regular', sans-serif;
        font-weight: 400;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Smooth transitions for theme changes */
      *, *::before, *::after {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border); 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text-dim); 
      }
      
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
